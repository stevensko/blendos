# CachyOS x86-64-v3 repositories.
#
# cachyos.sh installs this at /etc/pacman.d/cachyos.conf and adds
#   Include = /etc/pacman.d/cachyos.conf
# to /etc/pacman.conf immediately above [core], so these repos take precedence
# over stock Arch packages of the same name. SigLevel is inherited from
# [options] in pacman.conf (Required DatabaseOptional) - packages are verified.

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
