arch-repo: https://geo.mirror.pkgbuild.com
impl: https://github.com/blend-os/tracks/raw/main
repo: https://pkg-repo.blendos.co
track: blendos-base

commands:
  - 'curl -fsSL https://raw.githubusercontent.com/stevensko/blendos/main/.config/akshara/repos.sh | bash'
  - 'curl -fsSL https://raw.githubusercontent.com/stevensko/blendos/main/.config/akshara/manifest.sh -o /var/tmp/manifest.sh'
  - 'curl -fsSL https://raw.githubusercontent.com/stevensko/blendos/main/.config/akshara/fallback.sh -o /var/tmp/fallback.sh'
  - 'curl -fsSL https://raw.githubusercontent.com/stevensko/blendos/main/.config/akshara/install.sh | bash'
  - 'curl -fsSL https://raw.githubusercontent.com/stevensko/blendos/main/.config/akshara/migrate.sh | bash'
  - 'curl -fsSL https://raw.githubusercontent.com/stevensko/blendos/main/.config/akshara/post.sh | bash'